<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Search UI</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-[#bda7a0] p-4">
    <!-- Header -->
    <div
      class="bg-[#896C6C] p-2 rounded-t-lg flex justify-between items-center"
    >
      <div class="text-lg font-bold">Web Search</div>
      <div class="flex space-x-4">
        <button
          id="textSearchBtn"
          class="bg-[#F5FAE1] text-white px-4 py-2 rounded hover:bg-gray-400"
        >
          Text Search
        </button>

        <button
          id="temporalSearchBtn"
          class="bg-[#F5FAE1] px-4 py-2 rounded hover:bg-gray-400"
        >
          Temporal Search
        </button>

        <button
          id="asrSearchBtn"
          class="bg-[#F5FAE1] px-4 py-2 rounded hover:bg-gray-400"
        >
          ASR Search
        </button>

        <button
          id="ocrSearchBtn"
          class="bg-[#F5FAE1] px-4 py-2 rounded hover:bg-gray-400"
        >
          OCR Search
        </button>

        <button
          id="imageSearchBtn"
          class="bg-[#F5FAE1] px-4 py-2 rounded hover:bg-gray-400"
        >
          Image Search
        </button>
      </div>
    </div>

    <!-- Main -->
    <div class="bg-[#F5FAE1] p-4 rounded-b-lg mt-2">
      <!-- Layout mặc định (Text, ASR, OCR, Image + Filter) -->
      <div id="NormalLayout" class="flex">
        <!-- Left Panel -->
        <div class="w-1/2 pr-2">
          <!-- Text Search -->
          <div id="TextSearch" class="bg-white p-4 mb-4 rounded">
            <textarea
              id="queryBasic"
              class="w-full h-32 p-2 border border-gray-300 rounded resize-none"
              placeholder="Enter your text query..."
            ></textarea>
          </div>

          <!-- ASR Search -->
          <div id="AsrSearch" class="bg-white p-4 mb-4 rounded hidden">
            <textarea
              id="queryAsr"
              class="w-full h-32 p-2 border border-gray-300 rounded resize-none"
              placeholder="Enter your ASR query..."
            ></textarea>
          </div>

          <!-- OCR Search -->
          <div id="OcrSearch" class="bg-white p-4 mb-4 rounded hidden">
            <textarea
              id="queryOcr"
              class="w-full h-32 p-2 border border-gray-300 rounded resize-none"
              placeholder="Enter your OCR query..."
            ></textarea>
          </div>

          <!-- Image Search -->
          <div id="ImageSearch" class="bg-white p-9 mb-4 rounded hidden">
            <label class="block mb-2 font-semibold">📤 Upload Image</label>
            <input type="file" class="mb-2" />
            <p class="text-sm text-gray-500">Upload an image to search</p>
          </div>

          <!-- K slider -->
          <div id="KSlider" class="mt-0">
            <label for="kRange" class="block font-semibold">K</label>
            <div class="flex items-center space-x-3">
              <span id="kValue" class="w-10 text-right">200</span>
              <input
                type="range"
                id="kRange"
                min="25"
                max="400"
                step="25"
                value="200"
                class="flex-1 accent-blue-600"
              />
            </div>
          </div>
        </div>

        <!-- Filter Panel -->
        <div id="FilterPanel" class="w-1/2 pl-2">
          <div class="bg-[#EEE6CA] p-4 rounded">
            <h2 class="text-xl font-bold mb-4">Filter Panel</h2>
            <input
              type="text"
              id="ocrFilter"
              class="w-full p-2 mb-2 border border-gray-300 rounded"
              placeholder="OCR Filter..."
            />
            <input
              type="text"
              id="asrFilter"
              class="w-full p-2 border border-gray-300 rounded"
              placeholder="ASR Filter..."
            />
          </div>
        </div>
      </div>

      <!-- Temporal Search (full width) -->
      <div id="TemporalSearch" class="bg-white p-6 mb-4 rounded hidden">
        <h2 class="text-lg font-bold mb-4">Temporal Search</h2>
        <div class="grid grid-cols-3 gap-3">
          <!-- Hàng 1: Scene -->
          <input
            type="text"
            placeholder="Scene 1"
            class="p-2 border border-gray-300 rounded"
          />
          <input
            type="text"
            placeholder="Scene 2"
            class="p-2 border border-gray-300 rounded"
          />
          <input
            type="text"
            placeholder="Scene 3"
            class="p-2 border border-gray-300 rounded"
          />

          <!-- Hàng 2: OCR -->
          <input
            type="text"
            placeholder="OCR 1"
            class="p-2 border border-gray-300 rounded"
          />
          <input
            type="text"
            placeholder="OCR 2"
            class="p-2 border border-gray-300 rounded"
          />
          <input
            type="text"
            placeholder="OCR 3"
            class="p-2 border border-gray-300 rounded"
          />

          <!-- Hàng 3: ASR -->
          <input
            type="text"
            placeholder="ASR 1"
            class="p-2 border border-gray-300 rounded"
          />
          <input
            type="text"
            placeholder="ASR 2"
            class="p-2 border border-gray-300 rounded"
          />
          <input
            type="text"
            placeholder="ASR 3"
            class="p-2 border border-gray-300 rounded"
          />
        </div>
      </div>

      <!-- Search -->
      <button
        id="searchBtn"
        class="mt-4 bg-[#CDBBB7] text-white px-4 py-3 rounded w-full hover:bg-green-300 text-lg font-bold"
      >
        🔎 Search
      </button>

      <!-- Answers -->
      <div
        id="answerData"
        class="bg-[#896C6C] p-4 mt-4 rounded grid grid-cols-2 md:grid-cols-3 lg:grid-cols-6 gap-4 max-h-96 overflow-y-auto"
      ></div>
    </div>

    <!-- Popup video -->
    <div
      id="videoPopup"
      class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center"
    >
      <div class="bg-white rounded shadow-lg p-4 relative w-2/3">
        <span
          class="absolute top-0 right-1 text-xl cursor-pointer"
          onclick="closeVideo()"
          >х</span
        >
        <video id="popupVideo" controls class="w-full rounded"></video>

        <!-- overlay frame name -->
        <div
          id="frameNameOverlay"
          class="absolute bottom-4 right-6 bg-black bg-opacity-60 text-white px-2 py-1 rounded text-sm"
        >
          Frame name here
        </div>
      </div>
    </div>

    <!-- Modal Image Viewer -->
    <div
      id="imageModal"
      class="fixed inset-0 bg-black bg-opacity-70 hidden flex items-center justify-center z-50"
    >
      <img id="modalImage" class="max-w-3xl max-h-[90%] rounded shadow-lg" />
    </div>

    <script src="ans.js"></script>
    <script src="vid.js"></script>
    <script src="pic.js"></script>
    <script src="script.js"></script>
  </body>
</html>
