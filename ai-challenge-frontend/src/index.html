<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Search UI</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-4">
  <!-- Header -->
  <div class="bg-pink-200 p-2 rounded-t-lg flex justify-between items-center">
    <div class="text-lg font-bold">Web Search</div>
    <div class="flex space-x-4">
        <button id="textSearchBtn" class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600">
            Text Search
        </button>
        <button id="temporalSearchBtn" class="bg-gray-300 px-4 py-2 rounded hover:bg-gray-400">
            Temporal Search
        </button>
        <button id="imageSearchBtn" class="bg-gray-300 px-4 py-2 rounded hover:bg-gray-400">
            Image Search
        </button>
    </div>
  </div>

  <!-- Main (text, temporal) -->
  <div class="bg-gray-300 p-4 rounded-b-lg mt-2">
    <div class="flex">
      <!-- Left Panel -->
      <div class="w-1/2 pr-2">
        <!-- Text Search -->
        <div id="TextSearch" class="bg-white p-4 mb-4 rounded">
          <textarea id="queryBasic" class="w-full h-32 p-2 border border-gray-300 rounded resize-none" placeholder="Enter your text query..."></textarea>
        </div>

        <!-- Temporal Search -->
        <div id="TemporalSearch" class="bg-white p-4 mb-4 rounded hidden">
          <textarea id="queryTemporal" class="w-full h-32 p-2 border border-gray-300 rounded resize-none" placeholder="Enter your temporal query..."></textarea>
        </div>

        <!-- Image Search -->
        <div id="ImageSearch" class="bg-white p-9 mb-4 rounded hidden">
            <label class="block mb-2 font-semibold">📤 Upload Image</label>
            <input type="file" class="mb-2">
            <p class="text-sm text-gray-500">Upload an image to search</p>
        </div>

        <!-- K slider -->
        <div class="mt-0">
            <label for="kRange" class="block font-semibold">K</label>
            <div class="flex items-center space-x-2">
            <span id="kValue" class="w-10 text-right">200</span>
            <input 
                type="range" 
                id="kRange" 
                min="25" 
                max="400" 
                step="25" 
                value="200"
                class="flex-1 accent-blue-600"
            >
            </div>
        </div>
    </div>
    
      <!-- Filter Panel -->
      <div class="w-1/2 pl-2">
        <div class="bg-gray-200 p-4 rounded">
          <h2 class="text-xl font-bold mb-4">Filter Panel</h2>
          <input type="text" id="ocrFilter" class="w-full p-2 mb-2 border border-gray-300 rounded" placeholder="OCR Filter...">
          <input type="text" id="asrFilter" class="w-full p-2 border border-gray-300 rounded" placeholder="ASR Filter...">
        </div>
      </div>
    </div>
    

    <!-- Translate button -->
    <button class="mt-4 bg-gray-400 text-white px-4 py-3 rounded w-full hover:bg-green-500 text-lg font-bold">
      🔎 Translate 
    </button>

    <!-- Search -->
    <button id="searchBtn" class="mt-4 bg-gray-400 text-white px-4 py-3 rounded w-full hover:bg-green-500 text-lg font-bold">
      🔎 Search 
    </button>

    <!-- Answers -->
    <div id="answers" class="bg-pink-200 p-4 mt-4 rounded grid grid-cols-2 md:grid-cols-3 lg:grid-cols-6 gap-4 max-h-96 overflow-y-auto">
      <!-- answers -->
    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
